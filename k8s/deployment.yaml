apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid
spec:
  replicas: 2
  selector:
    matchLabels: {app: pulsegrid}
  template:
    metadata: {labels: {app: pulsegrid}}
    spec:
      containers:
        - name: pulsegrid
          image: pulsegrid:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid
spec:
  selector: {app: pulsegrid}
  ports:
    - port: 8080
      targetPort: 8080
